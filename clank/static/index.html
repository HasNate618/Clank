<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clank</title>
  <script>
    // Paint the first theme before CSS loads, so there is no flash. app.js owns
    // every change after this; the storage key is shared.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("clank-theme"); } catch (e) { /* private mode */ }
      var theme = saved ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="brand">
        <!-- A worker unit, not a word: the head is a tiny SVG so it stays
             crisp, and the eyes blink on their own schedule. -->
        <svg class="brand-face" viewBox="0 0 32 32" aria-hidden="true">
          <path class="antenna" d="M16 3.2v4.4"/>
          <circle class="antenna-tip" cx="16" cy="2.8" r="1.9"/>
          <rect class="head" x="5.5" y="7.6" width="21" height="17" rx="5.5"/>
          <g class="eyes">
            <rect class="eye" x="11" y="12.8" width="3.2" height="4.6" rx="1.6"/>
            <rect class="eye" x="17.8" y="12.8" width="3.2" height="4.6" rx="1.6"/>
          </g>
          <path class="grille" d="M12 20.4h8"/>
        </svg>
        <span class="brand-lockup">
          <span class="brand-mark">Clank</span>
          <span class="brand-plate">probationary unit</span>
        </span>
      </div>
      <div class="status-cluster">
        <!-- The badge sits with the words that describe it. -->
        <span id="state" class="badge">stopped</span>
        <span id="session-id"></span>
        <span id="run-state"></span>
        <!-- The spinner is the wait, the text beside it is what for: a spinner
             alone is an anxiety, a phrase alone looks like a stuck page. -->
        <span id="run-spinner" class="spinner" hidden aria-hidden="true"></span>
        <!-- What happened to this run's video, where the run is reported. It is
             news, not a control: `saving…` becomes a link when the file is ready. -->
        <a id="run-recording" class="rec-status" hidden></a>
        <span id="uptime"></span>
      </div>
      <div class="top-actions">
        <!-- Two pages, one control: a segmented pair in the same slot on both,
             so the page you are not on is a click away and looks like a button. -->
        <nav class="page-tabs" aria-label="Pages">
          <a class="page-tab" data-page="console" href="/" aria-current="page">Console</a>
          <a class="page-tab" data-page="recordings" href="/recordings">Recordings</a>
        </nav>
        <!-- One start. The stack is booted by the run when it is down, so there
             is nothing left for a second button to do. -->
        <button id="start-run" class="btn btn-go" disabled
                title="boots the stack first when it is down (about two minutes)">Start run</button>
        <button id="stop-run" class="btn btn-halt" disabled
                title="ends the attempt; the stack and the body view stay up">Stop run</button>
        <button id="stop" class="btn btn-halt" disabled
                title="ends the run, the stack and the body view">Shut down</button>
        <button id="mute-audio" class="btn btn-icon btn-audio" type="button" aria-label="Mute game audio" disabled>
          <svg class="icon icon-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/>
            <path class="wave" d="M15.4 8.7a4.6 4.6 0 0 1 0 6.6"/>
            <path class="wave" d="M18.1 6.2a8.2 8.2 0 0 1 0 11.6"/>
          </svg>
          <svg class="icon icon-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/>
            <path d="M16 9.5l5 5m0-5l-5 5"/>
          </svg>
        </button>
        <button id="theme-toggle" class="btn btn-icon" type="button" aria-label="Switch theme">
          <!-- Sun shows in the dark theme (the way out), moon in the light one. -->
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.4"/>
            <path class="ray" d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7"/>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.6A8.6 8.6 0 0 1 9.4 4a8.6 8.6 0 1 0 10.6 10.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="deck" id="deck" data-layout="side">
      <!-- The stage is the game, the control strip under it, and - on a
           near-square window - the brain feed, which is the one thing that can
           absorb arbitrary height. app.js moves that panel into the rail when
           the window is wide, because then the game fills the height and the
           rail is where a tall feed belongs. -->
      <section class="stage">
        <div class="screen">
          <section class="preview" id="preview-box" aria-label="Game preview">
            <div class="preview-clip" id="preview-clip">
              <div id="preview" tabindex="-1"></div>
              <canvas id="preview-live" hidden></canvas>
              <!-- Future visual debugging (grounding boxes, glow patches) draws
                   here in game-pixel coordinates. It never handles input. -->
              <canvas id="preview-overlay"></canvas>
            </div>
            <div id="preview-wait">
              <span id="preview-spinner" class="spinner" hidden aria-hidden="true"></span>
              <span id="preview-wait-text">session stopped</span>
            </div>
            <!-- The screen's own controls ride on the picture: a layout that
                 pays height for a toolbar pays for it twice, once here and
                 once in the stage budget. Hidden until frames arrive, because
                 a switch between two dead pictures is noise. -->
            <div class="screen-hud">
              <div class="view-switch" role="group" aria-label="Preview source">
                <button type="button" data-view="game" aria-pressed="true">Game</button>
                <button type="button" data-view="model" aria-pressed="false">Model</button>
              </div>
              <span id="preview-status" class="screen-status"></span>
            </div>
            <div id="manual-overlay" class="manual-overlay">
              <div class="manual-panel">
                <strong id="manual-title"></strong>
                <span id="manual-detail"></span>
              </div>
            </div>
            <form id="vnc-auth" class="vnc-auth">
              <div class="vnc-card">
                <h2>Preview login</h2>
                <label>Username <input id="vnc-user" autocomplete="username" required></label>
                <label>Password <input id="vnc-pass" type="password" autocomplete="current-password" aria-describedby="vnc-error" required></label>
                <button type="submit" class="btn btn-go">Connect preview</button>
                <p id="vnc-error" role="alert"></p>
              </div>
            </form>
          </section>
          <p id="error" class="error" role="alert"></p>
        </div>

        <!-- The robot panel holds the views and everything that steers them. -->
        <aside id="body-box">
          <div class="body-head">
            <span class="body-title">Robot</span>
          </div>
          <div id="body-tiles"></div>
          <div id="body-wait">body view off</div>
          <!-- The panel that shows the body is the panel that steers it: the look
               pads, the manual/robot switch and the body's own start/stop. -->
          <div class="body-controls">
            <p id="body-state" class="body-state"></p>
            <div class="verbs">
              <button type="button" data-verb="look_left" class="look look-left" aria-label="Look left">
                <span class="look-arrow" aria-hidden="true"></span>
                <span class="look-label">Look left</span>
              </button>
              <button type="button" data-verb="look_right" class="look look-right" aria-label="Look right">
                <span class="look-arrow" aria-hidden="true"></span>
                <span class="look-label">Look right</span>
              </button>
            </div>
            <button id="mode-toggle" class="mode-toggle" type="button" aria-pressed="false" disabled>
              Switch to manual override
            </button>
            <div class="body-actions">
              <button id="body-start" type="button" disabled>Start</button>
              <button id="body-stop" type="button" disabled>Stop</button>
            </div>
            <!-- JobBot asks the player to press the controller's menu button; nothing
                 on the robot can reach it, so this asks the relay for one press. -->
            <button id="menu-press" class="btn" type="button"
                    title="Presses the controller's menu button in the game"
                    aria-label="Press the controller menu button" disabled>Menu press</button>
            <div id="verb-status" class="verb-status"></div>
          </div>
        </aside>
      </section>

      <aside class="col col-rail">
        <section class="panel panel-brain">
          <h2>Brain <span id="brain-run"></span>
            <a id="watch-run" class="rec-watch" href="/recordings">watch this run</a></h2>
          <div id="brain-messages" class="brain-messages"></div>
        </section>

        <section class="panel panel-logs">
          <div class="logs-head">
            <h2>Logs</h2>
            <div id="log-filters" class="log-filters"></div>
          </div>
          <div id="log-tail" class="log-tail"></div>
        </section>

        <section class="panel panel-telemetry">
          <h2>Telemetry</h2>
          <div id="health"></div>
        </section>
      </aside>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
