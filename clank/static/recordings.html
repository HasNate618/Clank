<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clank — recordings</title>
  <script>
    // Same early theme paint as the console, so the two pages never flash at
    // each other when the operator crosses between them.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("clank-theme"); } catch (e) { /* private mode */ }
      var theme = saved ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="brand">
        <span class="brand-lockup">
          <span class="brand-mark">CLANK</span>
          <span class="brand-plate">recordings</span>
        </span>
      </div>
      <div class="status-cluster">
        <span id="recording-count"></span>
      </div>
      <div class="top-actions">
        <nav class="page-tabs" aria-label="Pages">
          <a class="page-tab" data-page="console" href="/">Console</a>
          <a class="page-tab" data-page="recordings" href="/recordings" aria-current="page">Recordings</a>
        </nav>
        <button id="theme-toggle" class="btn btn-icon" type="button" aria-label="Switch theme">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.4"/>
            <path class="ray" d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7"/>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.6A8.6 8.6 0 0 1 9.4 4a8.6 8.6 0 1 0 10.6 10.6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- One column, and the order is the argument: pick a run from the strip,
         watch it at its own size, then read why it did what it did. The picture
         is the page; the list and the diary are the margins of it. -->
    <main class="rec-deck">
      <section class="rec-strip" id="run-strip" aria-label="Runs">
        <span id="recording-hint" class="rec-hint"></span>
        <div id="recording-list" class="rec-list" aria-live="polite"></div>
      </section>

      <section class="rec-stage">
        <h2 id="recording-title">Pick a run</h2>
        <!-- Our own controls, not the browser's: the rail carries a tick per
             diary event, so the two panels share one clock and the operator can
             see an event coming before it lands. -->
        <div class="rec-player">
          <!-- preload="auto", not "metadata": with metadata alone the browser decodes
               no frame and a paused player is a black box until play. At this
               encoding that costs ~2.6 MB a minute (measured), so a twenty-minute
               run is tens of megabytes from local disk, not hundreds. -->
          <video id="recording-video" preload="auto" playsinline></video>
          <div class="rec-controls" id="rec-controls">
            <button id="play-toggle" class="rec-btn rec-play" type="button" aria-label="Play">▶</button>
            <span id="rec-time" class="rec-time">0:00</span>
            <div id="rec-rail" class="rec-rail" role="slider" tabindex="0"
                 aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
              <div id="rec-rail-fill" class="rec-rail-fill"></div>
              <div id="rec-rail-head" class="rec-rail-head"></div>
              <div id="rec-ticks" class="rec-ticks"></div>
            </div>
            <span id="rec-duration" class="rec-time">0:00</span>
            <button id="speed" class="rec-btn rec-speed" type="button"
                    title="Playback speed" aria-label="Playback speed">1×</button>
          </div>
        </div>
        <p id="recording-note" class="rec-note" role="status"></p>
        <div id="recording-meta" class="rec-meta"></div>
      </section>

      <section class="panel rec-diary-panel">
        <h2>Diary <span id="diary-count" class="rec-hint"></span></h2>
        <!-- The diary arrives with the picture: a row shows when the video
             reaches its moment, so what you read is what you are watching. -->
        <div id="run-diary" class="brain-messages"></div>
      </section>
    </main>
  </div>
  <script src="/recordings.js"></script>
</body>
</html>
